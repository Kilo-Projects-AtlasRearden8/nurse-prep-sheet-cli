[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nurse-prep-sheet"
version = "1.0.0"
description = "Local-first CLI for nurse shift prep sheets: patients, tasks, priorities, JSON storage, printable output. Education only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Asdale Dynamics, LLC"},
]

[project.scripts]
nurse-prep = "nurse_prep_sheet.cli:main"

[tool.setuptools]
packages = ["nurse_prep_sheet"]
